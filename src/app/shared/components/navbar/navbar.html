<nav class="navbar">
  <div class="navbar-inner max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- ===== Logo ===== -->
    <a routerLink="/dashboard" class="navbar-logo">
      <div class="logo-icon-box">
        <mat-icon class="logo-icon">account_balance_wallet</mat-icon>
      </div>
      <span class="logo-text">Mi Finanza</span>
    </a>

    <!-- ===== Desktop Navigation ===== -->
    <div class="desktop-nav">
      <a routerLink="/dashboard" routerLinkActive="nav-link--active" class="nav-link">
        <mat-icon class="nav-link-icon">dashboard</mat-icon>
        Dashboard
      </a>
      <a routerLink="/transactions" routerLinkActive="nav-link--active" class="nav-link">
        <mat-icon class="nav-link-icon">receipt_long</mat-icon>
        Transacciones
      </a>
      <a routerLink="/subscriptions" routerLinkActive="nav-link--active" class="nav-link">
        <mat-icon class="nav-link-icon">subscriptions</mat-icon>
        Suscripciones
      </a>
    </div>

    <!-- ===== Desktop User Menu ===== -->
    <div class="desktop-actions">
      <!-- User chip -->
      <div class="user-chip" *ngIf="currentUser$ | async as user">
        <div class="user-avatar">{{ getUserInitial(user.email) }}</div>
        <span class="user-email">{{ user.email }}</span>
      </div>
      <!-- Logout -->
      <button class="logout-btn" (click)="logout()">
        <mat-icon style="font-size:18px">logout</mat-icon>
        <span>Salir</span>
      </button>
    </div>

    <!-- ===== Hamburger (mobile) ===== -->
    <button class="hamburger" (click)="toggleMenu()" [class.hamburger--open]="menuOpen" aria-label="Menú">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <!-- ===== Mobile Menu ===== -->
  <div class="mobile-menu" [class.mobile-menu--open]="menuOpen">
    <a routerLink="/dashboard" routerLinkActive="mobile-link--active" class="mobile-link" (click)="menuOpen = false">
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </a>
    <a routerLink="/transactions" routerLinkActive="mobile-link--active" class="mobile-link" (click)="menuOpen = false">
      <mat-icon>receipt_long</mat-icon>
      Transacciones
    </a>
    <a routerLink="/subscriptions" routerLinkActive="mobile-link--active" class="mobile-link" (click)="menuOpen = false">
      <mat-icon>subscriptions</mat-icon>
      Suscripciones
    </a>
    <div class="mobile-divider"></div>
    <button class="mobile-logout" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Cerrar sesión
    </button>
  </div>
</nav>
